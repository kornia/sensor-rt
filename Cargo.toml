[workspace]
resolver = "2"
# Isolated Jetson sensor drivers. The driver crates depend on NO inference runtime —
# a consumer that only wants camera frames should not have to build TensorRT — so
# they own their device-shaped types (`OakIntrinsics`, `OakDepthMap`) and share only
# frame timing via the dependency-free `sensor-types` leaf. `vrt` (upstream
# kornia/vision-rt) appears solely in the examples that actually run models, and has
# no dependency back on sensors. Sensors emit kornia `Image<u8,3>` (device-resident).
members = [
    "crates/nvbuf-sys",
    "crates/sensor-types",
    "crates/sensor-oak",
    "crates/sensor-rtsp",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/kornia/sensor-rt"
authors = ["Edgar Riba <edgar.riba@gmail.com>"]

[workspace.dependencies]
# One cudarc across the workspace, matching vision-rt + kornia-rs's feature set so
# cargo unifies to a single build (shared CudaStream/CudaSlice types → zero-copy
# interop with the vrt models that consume these frames).
cudarc = { version = "0.19", default-features = false, features = [
  "cuda-version-from-build-system",
  "driver",
  "nvrtc",
  "std",
  "fallback-dynamic-loading",
  "fallback-latest",
] }
# vision-rt — the PUBLIC upstream (kornia/vision-rt), git-pinned to a fixed rev
# (Cargo.lock also locks it). Everything here is public — no forks, no patches.
#
# Two things worth knowing:
#   * upstream's vrt-xfeat already exposes the async `submit(img, &mut out)` API, so
#     sensor-rt needs NO patch to vision-rt to keep several frames in flight.
# NOTE: upstream's core crate is named `vrt` outright; the fork called it
# `vision-rt` and remapped it with `package = "vision-rt"`. That remap is gone.
vrt        = { git = "https://github.com/kornia/vision-rt", rev = "61e1dbcc42351cd62d89850aba384f2c0c53ba2a" }
vrt-xfeat  = { git = "https://github.com/kornia/vision-rt", rev = "61e1dbcc42351cd62d89850aba384f2c0c53ba2a" }
vrt-rfdetr = { git = "https://github.com/kornia/vision-rt", rev = "61e1dbcc42351cd62d89850aba384f2c0c53ba2a" }
vrt-hub    = { git = "https://github.com/kornia/vision-rt", rev = "61e1dbcc42351cd62d89850aba384f2c0c53ba2a" }
# kornia GPU image/tensor types — pinned to the same rev vision-rt uses.
kornia-image   = { git = "https://github.com/kornia/kornia-rs", tag = "v0.1.15-rc.4", features = ["cudarc"] }
kornia-tensor  = { git = "https://github.com/kornia/kornia-rs", tag = "v0.1.15-rc.4", features = ["cudarc"] }
kornia-imgproc = { git = "https://github.com/kornia/kornia-rs", tag = "v0.1.15-rc.4", features = ["cudarc"] }
kornia-io      = { git = "https://github.com/kornia/kornia-rs", tag = "v0.1.15-rc.4" }
# sensor-rt internal crates
nvbuf-sys    = { path = "crates/nvbuf-sys" }
sensor-types = { path = "crates/sensor-types" }
sensor-rtsp = { path = "crates/sensor-rtsp" }
sensor-oak  = { path = "crates/sensor-oak" }
# external
gstreamer     = "0.20"
gstreamer-app = "0.20"
thiserror     = "2.0"
env_logger    = "0.11"
# Example CLIs only (dev-dependency): argh over clap — a fraction of the compile
# time and dependency count, and these binaries need flags, not a framework.
argh          = "0.1"
# Example visualisation only. SDK feature just logs / writes .rrd — the native
# viewer feature would drag in a whole GUI stack we do not want on a Jetson.
rerun         = { version = "0.34", default-features = false, features = ["sdk"] }
cc            = "1"
cmake         = "0.1"
