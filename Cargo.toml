[workspace]
resolver = "2"
# Jetson RTSP camera source. A pure driver: decodes RTSP/H.264 over NVMM and emits
# a device-resident kornia `Image<u8,3>` — no algorithm dependency. Frame
# provenance (`stamp`) is vendored into `sensor-rtsp`, so the crate itself has no
# dependency on vision-rt (`vrt`); models consume these frames from the
# application side. Examples live inside `crates/sensor-rtsp/examples/`.
members = [
    "crates/nvbuf-sys",
    "crates/sensor-rtsp",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/kornia/sensor-rt"
authors = ["Edgar Riba <edgar.riba@gmail.com>", "Kornia AI"]

[workspace.dependencies]
# One cudarc across the workspace, matching kornia-rs's feature set so cargo
# unifies to a single build (shared CudaStream/CudaSlice for zero-copy interop
# with the models that consume these frames downstream).
cudarc = { version = "0.19", default-features = false, features = [
  "cuda-version-from-build-system",
  "driver",
  "nvrtc",
  "std",
  "fallback-dynamic-loading",
  "fallback-latest",
] }
# kornia GPU image/tensor types (device-resident RGB8 frames + the pack kernel).
kornia-image  = { git = "https://github.com/kornia/kornia-rs", tag = "v0.1.15-rc.4", features = ["cudarc"] }
kornia-tensor = { git = "https://github.com/kornia/kornia-rs", tag = "v0.1.15-rc.4", features = ["cudarc"] }
kornia-io     = { git = "https://github.com/kornia/kornia-rs", tag = "v0.1.15-rc.4" }
# sensor-rt internal crates
nvbuf-sys   = { path = "crates/nvbuf-sys" }
sensor-rtsp = { path = "crates/sensor-rtsp" }
# external
gstreamer     = "0.20"
gstreamer-app = "0.20"
thiserror     = "2.0"
env_logger    = "0.11"
cc            = "1"
