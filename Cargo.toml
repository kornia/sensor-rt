[workspace]
resolver = "2"
# Isolated Jetson sensor drivers. The driver crates depend on NO inference runtime —
# a consumer that only wants camera frames should not have to build TensorRT — so
# they own their device-shaped types (e.g. `OakIntrinsics`) and share only
# frame timing via the dependency-free `sensor-types` leaf. `vrt` (upstream
# kornia/vision-rt) appears solely in the examples that actually run models, and has
# no dependency back on sensors. Sensors emit kornia `Image<u8,3>` (device-resident).
members = [
    "crates/nvbuf-sys",
    "crates/sensor-types",
    "crates/sensor-oak",
    "crates/sensor-rtsp",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/kornia/sensor-rt"
authors = ["Edgar Riba <edgar.riba@gmail.com>"]

[workspace.dependencies]
# One cudarc across the workspace, matching vision-rt + kornia-rs's feature set so
# cargo unifies to a single build (shared CudaStream/CudaSlice types → zero-copy
# interop with the vrt models that consume these frames).
cudarc = { version = "0.19", default-features = false, features = [
  "cuda-version-from-build-system",
  "driver",
  "nvrtc",
  "std",
  "fallback-dynamic-loading",
  "fallback-latest",
] }
# vision-rt — the PUBLIC upstream (kornia/vision-rt), git-pinned to a fixed rev
# (Cargo.lock also locks it). Everything here is public — no forks, no patches.
#
# Two things worth knowing:
#   * upstream's vrt-xfeat already exposes the async `submit(img, &mut out)` API, so
#     sensor-rt needs NO patch to vision-rt to keep several frames in flight.
# NOTE: upstream's core crate is named `vrt` outright; the fork called it
# `vision-rt` and remapped it with `package = "vision-rt"`. That remap is gone.
vrt        = { git = "https://github.com/kornia/vision-rt", rev = "439fb20c503383ecc666810bb8282335555e4c23" }
vrt-xfeat  = { git = "https://github.com/kornia/vision-rt", rev = "439fb20c503383ecc666810bb8282335555e4c23" }
vrt-rfdetr = { git = "https://github.com/kornia/vision-rt", rev = "439fb20c503383ecc666810bb8282335555e4c23" }
vrt-hub    = { git = "https://github.com/kornia/vision-rt", rev = "439fb20c503383ecc666810bb8282335555e4c23" }
# kornia GPU image/tensor types — the IDENTICAL `branch = "main"` spec string vision-rt
# now uses (vision-rt `chore/kornia-spec-on-xfeat`, a spec-only commit on the rev this crate
# already validates against — main has diverged on the vrt-xfeat API): cargo keys a git source on the exact spec, so a
# differently-spelled pin yields two Image/Tensor types in one graph.
kornia-image   = { git = "https://github.com/kornia/kornia-rs", branch = "main", features = ["cuda"] }
kornia-tensor  = { git = "https://github.com/kornia/kornia-rs", branch = "main", features = ["cuda"] }
# One `cuda` feature since rc.5 (it merged the old cudarc/gpu-cuda/gpu-cubecl split).
# It covers both the device backend + custom kernels and the residency-aware colour
# dispatch this workspace needs for gray -> RGB on device.
#
# This tag MUST match the one vision-rt pins: two kornia versions in one graph means
# two distinct Image/Tensor types, which breaks the shared-type interop. Bump both
# repos together, or neither.
kornia-imgproc = { git = "https://github.com/kornia/kornia-rs", branch = "main", features = ["cuda"] }
kornia-io      = { git = "https://github.com/kornia/kornia-rs", branch = "main" }
# depthai-core, via the safe `depthai` wrapper (kornia/depthai-rs). sensor-oak
# holds no C++ any more; depthai-sys builds/links the native shim against the
# prefix named by DEPTHAI_PREFIX (see CLAUDE.md). Pinned by rev like vision-rt.
depthai     = { git = "https://github.com/kornia/depthai-rs", rev = "27a307add67319523f0ea4f55ccd891e4a678ae2" }
# Direct dep only so sensor-oak's build.rs can read DEP_DEPTHAI_CORE_RPATH and bake
# the depthai-core rpath into its examples (cargo does not propagate link args).
depthai-sys = { git = "https://github.com/kornia/depthai-rs", rev = "27a307add67319523f0ea4f55ccd891e4a678ae2" }
# sensor-rt internal crates
nvbuf-sys    = { path = "crates/nvbuf-sys" }
sensor-types = { path = "crates/sensor-types" }
sensor-rtsp = { path = "crates/sensor-rtsp" }
sensor-oak  = { path = "crates/sensor-oak" }
# external
gstreamer     = "0.20"
gstreamer-app = "0.20"
thiserror     = "2.0"
env_logger    = "0.11"
# Example CLIs only (dev-dependency): argh over clap — a fraction of the compile
# time and dependency count, and these binaries need flags, not a framework.
argh          = "0.1"
# Example visualisation only. SDK feature just logs / writes .rrd — the native
# viewer feature would drag in a whole GUI stack we do not want on a Jetson.
rerun         = { version = "0.34", default-features = false, features = ["sdk"] }
cc            = "1"
cmake         = "0.1"
