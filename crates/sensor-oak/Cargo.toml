[package]
name = "sensor-oak"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish = false
description = "OAK camera source: RGBD (colour + aligned depth + H.264), a time-synced stereo pair, and the on-board IMU"

build = "build.rs"

[lib]
name = "sensor_oak"

[dependencies]
# Deliberately minimal: this driver is a plain producer that never touches CUDA or
# an inference runtime, so a process that only wants camera frames builds neither.
# `cudarc` / `vrt` are dev-dependencies, for the examples that do.
#
# depthai-core is reached through the `depthai` safe wrapper (kornia/depthai-rs):
# no C++ shim in this crate any more. Everything OAK-specific that is POLICY —
# env knobs, steady->epoch clock shift, IMU rotation gate, calibration unit
# traps, degrade rules — lives here in Rust, where it is unit-testable.
depthai       = { workspace = true }
depthai-sys   = { workspace = true }
thiserror     = { workspace = true }
kornia-image  = { workspace = true }
# For the borrowed (zero-copy) image storage — see OakStereoFrame::left_image.
sensor-types  = { workspace = true }

[features]
# Build depthai-core from depthai-rs's pinned source instead of linking DEPTHAI_PREFIX.
vendored = ["depthai-sys/vendored"]

[dev-dependencies]
# Examples only. The driver itself needs none of this — see the note above.
vrt        = { workspace = true }
vrt-xfeat  = { workspace = true }
kornia-imgproc = { workspace = true }
vrt-hub    = { workspace = true, features = ["builder"] }
cudarc     = { workspace = true }
rerun      = { workspace = true }
argh       = { workspace = true }
env_logger = { workspace = true }
