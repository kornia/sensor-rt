[package]
name = "sensor-oak"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish = false
description = "OAK-D source: RGB + aligned depth, and a synced stereo pair + IMU; produces kornia Images"
# The depthai-core C shim is built and linked here rather than by a separate `-sys`
# crate: it has exactly one consumer (this crate), and `links` still guarantees only
# one copy of the native library in the graph.
links = "depthai-core"
build = "build.rs"

[lib]
name = "sensor_oak"

[dependencies]
# Deliberately minimal: this driver is a plain producer that never touches CUDA or
# an inference runtime, so a process that only wants camera frames builds neither.
# `cudarc` / `vrt` are dev-dependencies, for the examples that do.
kornia-image  = { workspace = true }
# For the borrowed (zero-copy) image storage — see OakStereoFrame::left_image.
kornia-tensor = { workspace = true }
sensor-types  = { workspace = true }

[build-dependencies]
cmake = { workspace = true }

[dev-dependencies]
# Examples only. The driver itself needs none of this — see the note above.
vrt        = { workspace = true }
vrt-xfeat  = { workspace = true }
vrt-hub    = { workspace = true, features = ["builder"] }
cudarc     = { workspace = true }
rerun      = { workspace = true }
argh       = { workspace = true }
env_logger = { workspace = true }
