[package]
name = "sensor-oak"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish = false
description = "OAK-D source: RGB + aligned depth, and a synced stereo pair + IMU; produces kornia Images"
# The depthai-core C shim is built and linked here rather than by a separate `-sys`
# crate: it has exactly one consumer (this crate), and `links` still guarantees only
# one copy of the native library in the graph.
links = "depthai-core"
build = "build.rs"

[lib]
name = "sensor_oak"

[dependencies]
# NOTE: no `vrt` here on purpose — this driver is a plain producer, so nothing that
# only wants camera frames should have to build a TensorRT runtime. `vrt` is a
# dev-dependency for the examples that actually run models.
cudarc        = { workspace = true }
kornia-image  = { workspace = true }
kornia-tensor = { workspace = true }
sensor-types  = { workspace = true }

[build-dependencies]
cmake = { workspace = true }

[dev-dependencies]
vrt        = { workspace = true }
kornia-io  = { workspace = true }
vrt-xfeat  = { workspace = true }
vrt-hub    = { workspace = true, features = ["builder"] }
env_logger = { workspace = true }
