[package]
name = "sensor-rtsp"
version.workspace = true
edition.workspace = true
repository.workspace = true
publish = false
description = "RTSP/H.264 camera source with Jetson NVMM decode (GStreamer); produces a kornia Image"

[lib]
name = "sensor_rtsp"

[dependencies]
nvbuf-sys     = { workspace = true }
gstreamer     = { workspace = true }
gstreamer-app = { workspace = true }
sensor-types  = { workspace = true }
kornia-image  = { workspace = true }
kornia-tensor = { workspace = true }
thiserror     = { workspace = true }
cudarc        = { workspace = true }

[dev-dependencies]
# Examples only: the models they run, plus PNG output and CLI parsing. The driver
# itself depends on none of this.
vrt          = { workspace = true }
vrt-xfeat    = { workspace = true }
vrt-rfdetr   = { workspace = true }
vrt-hub      = { workspace = true, features = ["hub", "builder"] }
kornia-io    = { workspace = true }
env_logger   = { workspace = true }
argh         = { workspace = true }
