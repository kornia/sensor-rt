name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Formatting gate — pure parse, resolves no dependencies, so it runs on a free
  # hosted runner even though the crates need Jetson-only native libs (NVMM,
  # depthai) and a private git dep (vision-rt).
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # Dependency-resolution gate. Cannot COMPILE on a hosted runner (build.rs compiles the
  # depthai C++ shim), but `cargo metadata --locked` resolves the whole graph without
  # building — which catches a Cargo.lock that was never regenerated after a spec change
  # (a stale lock silently re-resolves on a plain build and can split a crate in two).
  # Compile coverage still needs `jetson` below.
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo metadata --locked --format-version 1 > /dev/null

  # Self-hosted Jetson runner: real CUDA + NVMM (GStreamer) and a depthai-core
  # prefix (built once by kornia/depthai-rs's build script, or `--features vendored`).
  # Register a runner on the Orin with labels [self-hosted, jetson], set
  # DEPTHAI_PREFIX on it, then remove the `if: false` guard.
  jetson:
    # NOTE: while this is disabled, NOTHING in CI compiles — `fmt` only parses and
    # `deps` only resolves. A signature change that misses a caller reaches main.
    if: false # enable once a self-hosted Jetson runner is registered
    runs-on: [self-hosted, jetson]
    env:
      CARGO_BUILD_JOBS: "2" # 7.4 GB RAM — parallel native builds OOM the box
      DEPTHAI_PREFIX: /opt/depthai # lib/cmake/depthai inside; depthai-sys bakes the rpath
    steps:
      - uses: actions/checkout@v4
      - name: Build workspace
        run: cargo build -j2
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test -j2
