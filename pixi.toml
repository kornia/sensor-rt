[workspace]
name = "sensor-rt"
channels = ["conda-forge"]
platforms = ["linux-aarch64", "linux-64"]

# pixi pins the native toolchain the OAK-D path needs when depthai-core is built from source
# (`cargo build -p sensor-oak --features vendored`, done by kornia/depthai-rs's build script).
# GStreamer + libnvbufsurface (for sensor-rtsp/nvbuf-sys) are SYSTEM/JetPack, not conda — not
# listed here.
# conda-forge / linux-aarch64 / CARGO_BUILD_JOBS cap.
[dependencies]
cmake = ">=3.28"
ninja = "*"
pkg-config = "*"
libusb = "*"

# Orin Nano ~7.4 GB RAM — cap parallel cargo so heavy template builds don't OOM the box.
# (aarch64 only: x86 dev laptops have the RAM to run unconstrained.)
[target.linux-aarch64.activation.env]
CARGO_BUILD_JOBS = "2"

[tasks]
build = "cargo build --release"
check = "cargo check"
fmt = "cargo fmt --all"
